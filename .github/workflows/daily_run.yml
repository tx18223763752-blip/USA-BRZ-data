name: Daily Update Data


on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 允许把脚本产出的数据/图表自动提交回仓库

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib openpyxl python-calamine

      # 图表脚本使用中文标题/标注，安装中文字体避免图片乱码
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # 脚本原本面向 Windows 环境，这里在 runner 上做临时适配：
      #   1) cftc_managed_money.py  输出目录 E:\precip-excel\...  -> 脚本所在目录
      #   2) generate_usda_charts.py 输入文件 E:\precip-excel\... -> progress.py 生成的脚本目录 xlsx
      #   3) conab_soy_auto.py      把 auto.csv 纳入历史基线，实现真正增量
      #   4) 三个绘图脚本的中文字体列表追加 Noto Sans CJK SC
      # （只改 runner 上的副本，不影响仓库源码）
      - name: Patch scripts for Linux runner
        run: |
          python - <<'PYEOF'
          import pathlib

          def patch(path, pairs):
              fp = pathlib.Path(path)
              s = fp.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in s:
                      print(f"[warn] NOT FOUND in {path}: {old[:70]}")
                      continue
                  s = s.replace(old, new)
                  print(f"[ok] patched {path}: {old[:70]}")
              fp.write_text(s, encoding="utf-8")

          patch("cftc_managed_money.py", [
              ('OUT_DIR = r"E:\\precip-excel\\CFTC-Managed Money"',
               'OUT_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), "CFTC-Managed Money")'),
              ('["Microsoft YaHei", "SimHei", "Arial Unicode MS"]',
               '["Noto Sans CJK SC", "Microsoft YaHei", "SimHei", "Arial Unicode MS"]'),
          ])

          patch("generate_usda_charts.py", [
              ('INPUT_FILE = r"E:\\precip-excel\\USA-soy\\USDA_Soybean_Data_2020_2026.xlsx"',
               'INPUT_FILE = os.path.join(os.path.dirname(os.path.abspath(__file__)), "USDA_Soybean_Data_2020_2026.xlsx")'),
              ("['Microsoft YaHei', 'SimHei', 'DejaVu Sans']",
               "['Noto Sans CJK SC', 'Microsoft YaHei', 'SimHei', 'DejaVu Sans']"),
          ])

          patch("conab_soy_auto.py", [
              ('''HISTORY_CSVS = [
    os.path.join(BASE_DIR, "CONAB_soy_progress_2022_2026.csv"),
]''',
               '''HISTORY_CSVS = [
    os.path.join(BASE_DIR, "CONAB_soy_progress_auto.csv"),
    os.path.join(BASE_DIR, "CONAB_soy_progress_2022_2026.csv"),
]'''),
              ('["Microsoft YaHei", "SimHei", "Arial Unicode MS"]',
               '["Noto Sans CJK SC", "Microsoft YaHei", "SimHei", "Arial Unicode MS"]'),
          ])
          PYEOF

      # 1) 先抓 USDA 数据生成 xlsx（首次全量较慢，后续增量）
      - name: Run progress.py (USDA NASS -> Excel)
        run: python progress.py
        continue-on-error: true

      # 2) 再用 xlsx 生成 USDA 图表（依赖上一步产物）
      - name: Run generate_usda_charts.py
        run: python generate_usda_charts.py
        continue-on-error: true

      # 3) CONAB 巴西大豆种植/收获进度（增量）
      - name: Run conab_soy_auto.py
        run: python conab_soy_auto.py
        continue-on-error: true

      # 4) CFTC Managed Money 持仓（增量）
      - name: Run cftc_managed_money.py
        run: python cftc_managed_money.py
        continue-on-error: true

      # 提交并推送所有更新（无变化时自动跳过）
      - name: Commit & push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update data $(date -u +'%Y-%m-%d')"
          git push
