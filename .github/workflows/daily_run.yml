name: run-scripts
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 下面保留你原来所有步骤：安装python、pip、运行脚本、Commit & push ...


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib beautifulsoup4 python-calamine==0.7.0 openpyxl lxml

      - name: Run all python scripts
        run: |
          python cftc_managed_money.py
          python conab_soy_auto.py
          python generate_usda_charts.py
          python progress.py

      - name: Commit & push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 拉取远程最新代码，解决版本冲突
          git pull origin main --allow-unrelated-histories
          # 添加变更文件
          git add .
          # 提交，无变更则跳过提交；[skip ci] 防止循环触发workflow
          git commit -m "Auto update charts and data [skip ci]" || echo "No changes to commit"
          git push origin main
