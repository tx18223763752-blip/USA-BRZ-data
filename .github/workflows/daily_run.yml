name: Daily Update Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib beautifulsoup4 python-calamine

      - name: Run all python scripts
        run: |
          python cftc_managed_money.py
          python conab_soy_auto.py
          python generate_usda_charts.py
          python progress.py

      - name: Commit & push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update data $(date '+%Y-%m-%d')" || echo "No changes to commit"
          git push
